<style>
  :root {
    --fondo: #fdf6ec;
    --brillo: #ffffff;
    --halo: rgba(61, 143, 224, 0.16);
    --tinta: #1d2b3f;
    --burbuja: #ffffff;
    --burbuja-tinta: #1d2b3f;
    --sombra: rgba(29, 43, 63, 0.16);
    --verde: #25d366;
    --verde-oscuro: #128c4b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fondo: #0f1b2d;
      --brillo: #1b2c45;
      --halo: rgba(61, 143, 224, 0.28);
      --tinta: #eef4fb;
      --sombra: rgba(0, 0, 0, 0.4);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    display: flex; flex-direction: column;
    min-height: 100%; height: 100dvh; overflow: hidden;
    font-family: "Nunito", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    color: var(--tinta);
    background:
      radial-gradient(ellipse 75% 55% at 50% 45%, var(--halo) 0%, transparent 70%),
      radial-gradient(ellipse 90% 70% at 50% 40%, var(--brillo) 0%, var(--fondo) 75%);
    background-color: var(--fondo);
    -webkit-tap-highlight-color: transparent;
  }

  .escena { position: relative; flex: 1; min-height: 0; }
  .escena canvas, .escena .poster {
    position: absolute; inset: 0; width: 100%; height: 100%; display: block;
  }
  .escena canvas { touch-action: manipulation; opacity: 0; transition: opacity .5s ease; }
  .escena .poster { object-fit: contain; transition: opacity .5s ease; pointer-events: none; }
  .listo canvas { opacity: 1; }
  .listo .poster { opacity: 0; }

  .burbuja {
    position: absolute; left: 0; top: 0; z-index: 3; pointer-events: none;
    max-width: min(270px, 72vw);
    background: var(--burbuja); color: var(--burbuja-tinta);
    padding: 11px 16px; border-radius: 20px;
    font-size: 17px; font-weight: 700; line-height: 1.3;
    box-shadow: 0 10px 28px var(--sombra), 0 2px 6px var(--sombra);
    transform-origin: 18% 100%;
    opacity: 0; scale: .6;
    transition: opacity .25s ease, scale .35s cubic-bezier(.3, 1.6, .5, 1);
  }
  .burbuja.ver { opacity: 1; scale: 1; }
  .burbuja.izq { transform-origin: 82% 100%; }
  .burbuja::after {
    content: ""; position: absolute; left: 22px; bottom: -9px;
    border: 10px solid transparent; border-top-color: var(--burbuja); border-bottom: 0;
  }
  .burbuja.izq::after { left: auto; right: 22px; }
  /* Sin 3D: el globo queda fijo sobre la imagen */
  .sin-3d .burbuja { left: 50%; top: 6%; translate: -50% 0; }

  .invitacion {
    display: flex; align-items: center; justify-content: center; gap: 12px;
    padding: 14px 16px calc(22px + env(safe-area-inset-bottom));
  }
  .invitacion p { margin: 0; font-size: clamp(19px, 5.4vw, 24px); font-weight: 800; letter-spacing: .1px; }
  .wa {
    flex: none; display: grid; place-items: center;
    width: 44px; height: 44px; border-radius: 50%;
    background: var(--verde); color: #fff;
    box-shadow: 0 6px 16px rgba(37, 211, 102, .35);
    transition: transform .15s ease, background .15s ease;
  }
  .wa:hover { background: var(--verde-oscuro); }
  .wa:active { transform: scale(.92); }
  .wa:focus-visible { outline: 3px solid var(--tinta); outline-offset: 3px; }
  .wa svg { width: 25px; height: 25px; }
</style>
</head>
<body>
<main class="escena" id="escena">
  <img class="poster" src="pipo.webp" alt="Pipo, un robotito azul sentado en un puf amarillo con una lata roja">
  <canvas id="pipo" aria-label="Pipo, un robotito azul. Tócalo y te dice algo bonito." role="img"></canvas>
  <div class="burbuja" id="burbuja" aria-live="polite"></div>
</main>
<footer class="invitacion">
  <p>¿Te gustaría ser mi amigo?</p>

  </a>
</footer>
<script src="app.js?v=__VERSION__" defer></script>
</body>
</html>
